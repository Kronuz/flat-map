name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
permissions:
  contents: read
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      cmake_args: -DFLAT_MAP_BUILD_BENCH=ON
      tsan: false
